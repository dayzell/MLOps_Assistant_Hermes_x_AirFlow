[project]
name = "airflow-mlops"
version = "1.3.0"
description = "Hermes Agent plugin: Apache Airflow monitoring, diagnosis, targeted retries and reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Runtime dependencies only (installed by Hermes' plugin manager). Upper bounds on each:
# httpx is pre-1.0, so it is bounded to the next minor release.
dependencies = [
    "httpx>=0.27,<0.29",
    "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/dayzell/MLOps_Assistant_Hermes_x_AirFlow"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # status emoji (e.g. "ℹ️") in the answers
