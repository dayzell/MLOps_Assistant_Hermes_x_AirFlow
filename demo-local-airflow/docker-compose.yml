# Optional, manual integration test only: a throw-away single-container Airflow 3
# (standalone mode, SQLite, SimpleAuthManager). NOT for production.
#
#   docker compose -f demo-local-airflow/docker-compose.yml up
#   -> API on http://localhost:8080, user admin / password admin (see passwords.json)
services:
  airflow:
    image: apache/airflow:3.1.0
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      AIRFLOW__API__EXPOSE_CONFIG: "false"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./passwords.json:/opt/airflow/passwords.json:ro
